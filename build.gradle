plugins {
    id 'application'
    id 'org.jetbrains.kotlin.jvm' version '2.3.20'
}

group = 'org.ayachinene'
version = '1.0-SNAPSHOT'

ext {
    exposedVersion = '1.3.0'
    jsonSchemaVersion = '4.38.0'
    koinVersion = '4.2.1'
    ktorVersion = '3.5.0'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.openai:openai-java:4.38.0'
    implementation "io.ktor:ktor-server-core-jvm:$ktorVersion"
    implementation "io.ktor:ktor-server-netty-jvm:$ktorVersion"
    implementation "io.ktor:ktor-server-call-logging-jvm:$ktorVersion"
    implementation platform("io.insert-koin:koin-bom:$koinVersion")
    implementation 'io.insert-koin:koin-core'
    implementation 'io.github.classgraph:classgraph:4.8.184'
    implementation "com.github.victools:jsonschema-generator:$jsonSchemaVersion"
    implementation "com.github.victools:jsonschema-module-jackson:$jsonSchemaVersion"
    implementation "org.jetbrains.exposed:exposed-core:$exposedVersion"
    implementation "org.jetbrains.exposed:exposed-jdbc:$exposedVersion"
    implementation "org.jetbrains.exposed:exposed-java-time:$exposedVersion"
    implementation 'com.zaxxer:HikariCP:7.0.2'
    implementation 'com.github.f4b6a3:uuid-creator:6.1.1'
    implementation 'io.github.cdimascio:dotenv-kotlin:6.5.1'
    runtimeOnly 'org.postgresql:postgresql:42.7.7'
    runtimeOnly 'com.h2database:h2:2.4.240'
    runtimeOnly 'ch.qos.logback:logback-classic:1.5.18'

    testImplementation 'org.jetbrains.kotlin:kotlin-test'
}

kotlin {
    jvmToolchain(21)

    compilerOptions {
        freeCompilerArgs.add('-opt-in=kotlin.uuid.ExperimentalUuidApi')
    }
}

test {
    useJUnitPlatform()
}

application {
    mainClass = 'life.main.MainKt'
}
