<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Stream Demo</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; background: #f6f7f9; color: #16181d; }
    main { max-width: 880px; margin: 0 auto; padding: 32px 20px; }
    h1 { margin: 0 0 20px; font-size: 24px; font-weight: 700; letter-spacing: 0; }
    form { display: grid; gap: 12px; }
    textarea {
      min-height: 108px; resize: vertical; padding: 14px 16px; border: 1px solid #c7ccd6;
      border-radius: 8px; font: inherit; line-height: 1.5; background: #fff;
    }
    button {
      justify-self: start; height: 40px; padding: 0 18px; border: 0; border-radius: 8px;
      background: #176b87; color: #fff; font: inherit; font-weight: 650; cursor: pointer;
    }
    button:disabled { opacity: .55; cursor: progress; }
    pre {
      min-height: 280px; margin: 20px 0 0; padding: 18px; border: 1px solid #d9dde5;
      border-radius: 8px; background: #fff; white-space: pre-wrap; line-height: 1.6;
      font: 15px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
  </style>
</head>
<body>
  <main>
    <h1>AI Stream Demo</h1>
    <form id="form">
      <textarea id="input" autofocus>Write a short paragraph about Kotlin streaming.</textarea>
      <button id="send" type="submit">Send</button>
    </form>
    <pre id="output"></pre>
  </main>
  <script>
    const form = document.querySelector("#form");
    const input = document.querySelector("#input");
    const output = document.querySelector("#output");
    const send = document.querySelector("#send");
    let queue = [];
    let timer = null;

    function type(text) {
      queue.push(...text);
      if (timer) return;
      timer = setInterval(() => {
        const char = queue.shift();
        if (char === undefined) {
          clearInterval(timer);
          timer = null;
          return;
        }
        output.textContent += char;
        output.scrollTop = output.scrollHeight;
      }, 16);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      output.textContent = "";
      queue = [];
      send.disabled = true;

      try {
        const response = await fetch("/api/chat", { method: "POST", body: input.value });
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          type(decoder.decode(value, { stream: true }));
        }
        type(decoder.decode());
      } catch (error) {
        type(`[error] ${error.message}`);
      } finally {
        send.disabled = false;
      }
    });
  </script>
</body>
</html>
